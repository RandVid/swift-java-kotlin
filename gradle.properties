org.gradle.java.installations.fromEnv=JAVA_HOME_25,JAVA_HOME_25_X64,JAVA_HOME_25_ARM64,JAVA_HOME_21,JAVA_HOME_21_X64,JAVA_HOME_21_ARM64,JAVA_HOME_17,JAVA_HOME_17_X64,JAVA_HOME_17_ARM64

# Raised heaps so the Kotlin/Native compiler can process very large generated
# files (e.g. KotlinNativeStructStressApp at N>=3000 emits 200k+ line wrappers).
# Machine has 69 GB RAM; these are ceilings, not reservations.
org.gradle.jvmargs=-Xmx8g
kotlin.daemon.jvmargs=-Xmx16g
